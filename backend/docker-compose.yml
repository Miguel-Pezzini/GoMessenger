services:
  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"

  mongo-chat:
    image: mongo:7
    container_name: mongo_chat
    ports:
      - "27018:27017"
    volumes:
      - mongo_chat_data:/data/db

  mongo-user:
    image: mongo:7
    container_name: mongo_user
    ports:
      - "27019:27017"
    volumes:
      - mongo_user_data:/data/db

  mongo-friends:
    image: mongo:7
    container_name: mongo_friends
    ports:
      - "27020:27017"
    volumes:
      - mongo_friends_data:/data/db

  mongo-logging:
    image: mongo:7
    container_name: mongo_logging
    ports:
      - "27021:27017"
    volumes:
      - mongo_logging_data:/data/db

  mongo-media:
    image: mongo:7
    container_name: mongo_media
    ports:
      - "27022:27017"
    volumes:
      - mongo_media_data:/data/db

  minio:
    image: minio/minio:latest
    container_name: minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    profiles:
      - observability
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    ports:
      - "9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    profiles:
      - observability
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

  node-exporter:
    image: prom/node-exporter:latest
    container_name: node_exporter
    profiles:
      - host-metrics
    command:
      - "--path.rootfs=/host"
    pid: host
    volumes:
      - /:/host:ro

volumes:
  mongo_chat_data:
  mongo_user_data:
  mongo_friends_data:
  mongo_logging_data:
  mongo_media_data:
  minio_data:
  prometheus_data:
  grafana_data:

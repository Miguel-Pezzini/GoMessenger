services:
  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"

  mongo-chat:
    image: mongo:7
    container_name: mongo_chat
    ports:
      - "27018:27017"
    volumes:
      - mongo_chat_data:/data/db

  mongo-user:
    image: mongo:7
    container_name: mongo_user
    ports:
      - "27019:27017"
    volumes:
      - mongo_user_data:/data/db

  mongo-friends:
    image: mongo:7
    container_name: mongo_friends
    ports:
      - "27020:27017"
    volumes:
      - mongo_friends_data:/data/db

  mongo-logging:
    image: mongo:7
    container_name: mongo_logging
    ports:
      - "27021:27017"
    volumes:
      - mongo_logging_data:/data/db

  mongo-media:
    image: mongo:7
    container_name: mongo_media
    ports:
      - "27022:27017"
    volumes:
      - mongo_media_data:/data/db

  minio:
    image: minio/minio:latest
    container_name: minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

volumes:
  mongo_chat_data:
  mongo_user_data:
  mongo_friends_data:
  mongo_logging_data:
  mongo_media_data:
  minio_data:
